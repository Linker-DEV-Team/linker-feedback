name: 功能建议 / Feature request
description: 说明想完成的事情，以及当前流程的不足
title: "[Feature] "
labels: ["kind:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: 可以使用中文或英文。请先搜索已有建议；提交不代表已经承诺开发或发布时间。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / Problem to solve
      description: 描述实际工作流程，以及在哪里受阻。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样使用 / Desired workflow
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有办法与参考 / Alternatives and references
      description: 如有截图或参考链接，请确认可以公开。
