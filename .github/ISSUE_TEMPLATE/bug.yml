name: 故障反馈 / Bug report
description: 已有功能报错、崩溃或结果不符合预期
title: "[Bug] "
labels: ["kind:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: 请先搜索已有问题。描述与附件公开；私密材料请发 support@baigave.cn，并注明 Issue 编号。可以使用中文或英文。未知版本写「未知」，不涉及的项目写「不适用」。
  - type: dropdown
    id: area
    attributes:
      label: 问题模块 / Area
      options: [世界导入, 实体与动画, Nacre 渲染, 游玩与建造, 粒子, 安装与更新, 诊断与反馈, 官网, 其他]
    validations:
      required: true
  - type: input
    id: linker
    attributes:
      label: Linker 版本 / Linker version
      placeholder: 实际安装的完整版本
    validations:
      required: true
  - type: input
    id: blender
    attributes:
      label: Blender 版本 / Blender version
      placeholder: 例如 5.0.0
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft 与加载器 / Minecraft and loader
      placeholder: 例如 Minecraft 1.21.1、NeoForge 21.1.xxx
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 系统与相关组件 / Environment
      description: 系统、显卡；相关模组、光影和资源包名称与完整版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: 按顺序说明做了什么，以及问题出现在哪一步。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏与诊断 / Evidence
      description: 可拖入截图或诊断 ZIP。诊断包从 Blender 顶栏 Linker Diagnostics 导出；先检查再上传。私人材料通过邮件提供，并在这里说明已发送。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已搜索已有问题，并确认正文与附件可以公开，不含密钥、授权码或私人素材。
          required: true
